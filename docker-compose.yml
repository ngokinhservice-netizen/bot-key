services:
  # PostgreSQL Database (Production)
  postgres:
    image: postgres:16-alpine
    container_name: mtk_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mtk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtk_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-mtk_key_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mtk_user} -d ${POSTGRES_DB:-mtk_key_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mtk_network

  # MTK Key Bot Application (Bot + FastAPI Webhook + Admin Dashboard)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mtk_key_bot_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-mtk_user}:${POSTGRES_PASSWORD:-mtk_secure_password_2026}@postgres:5432/${POSTGRES_DB:-mtk_key_bot}
    volumes:
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    networks:
      - mtk_network

volumes:
  postgres_data:
    driver: local

networks:
  mtk_network:
    driver: bridge
