<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - MTK Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#0a0f1d', 800: '#0f172a', 700: '#1e293b' },
                        cyan: { 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-navy-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-navy-800 border border-navy-700 rounded-2xl shadow-2xl p-8">
        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white text-2xl font-black shadow-lg shadow-cyan-500/20 mb-3">
                ⚡
            </div>
            <h1 class="text-2xl font-black text-white tracking-wide">MTK KEY BOT</h1>
            <p class="text-xs text-cyan-400 font-mono mt-1">ĐĂNG NHẬP HỆ THỐNG QUẢN TRỊ</p>
        </div>

        {% if error %}
        <div class="mb-5 p-3 rounded-lg bg-red-500/15 border border-red-500/30 text-red-400 text-xs font-medium">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/admin/login" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Tên đăng nhập</label>
                <input type="text" name="username" required autocomplete="username"
                       class="w-full px-4 py-2.5 bg-navy-900/80 border border-navy-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Mật khẩu</label>
                <input type="password" name="password" required autocomplete="current-password"
                       class="w-full px-4 py-2.5 bg-navy-900/80 border border-navy-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition text-sm">
            </div>

            <button type="submit"
                    class="w-full mt-2 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-navy-900 font-bold rounded-xl shadow-lg shadow-cyan-500/20 transition-all text-sm uppercase tracking-wider">
                Đăng nhập Dashboard
            </button>
        </form>

        <div class="mt-6 text-center text-slate-500 text-xs">
            Hệ thống bảo vệ đa lớp & kiểm toán tự động MTK Security
        </div>
    </div>
</body>
</html>
